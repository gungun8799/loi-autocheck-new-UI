<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Database Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .connection-info {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .tab:hover {
            background: #ebebeb;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }
        
        .content {
            padding: 30px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status.completed {
            background: #4caf50;
            color: white;
        }
        
        .status.failed {
            background: #f44336;
            color: white;
        }
        
        .status.processing {
            background: #ff9800;
            color: white;
        }
        
        .status.uploaded {
            background: #2196f3;
            color: white;
        }
        
        .role {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            background: #9c27b0;
            color: white;
        }
        
        .role.admin {
            background: #f44336;
        }
        
        .actions {
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 10px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .search-box {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 MongoDB Database Viewer</h1>
            <div class="connection-info">Connected to: mongodb://localhost:27017/vision-app</div>
        </header>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview')">Overview</button>
            <button class="tab" onclick="switchTab('users')">Users</button>
            <button class="tab" onclick="switchTab('documents')">Documents</button>
            <button class="tab" onclick="switchTab('sessions')">Sessions</button>
        </div>
        
        <div class="content">
            <!-- Overview Tab -->
            <div id="overview" class="tab-content active">
                <h2>Database Overview</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="userCount">-</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="docCount">-</div>
                        <div class="stat-label">Total Documents</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="sessionCount">-</div>
                        <div class="stat-label">Total Sessions</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="successRate">-</div>
                        <div class="stat-label">Success Rate</div>
                    </div>
                </div>
                
                <h3>Recent Activity</h3>
                <div id="recentActivity" class="loading">Loading...</div>
            </div>
            
            <!-- Users Tab -->
            <div id="users" class="tab-content">
                <h2>User Management</h2>
                <div class="actions">
                    <button onclick="refreshUsers()">🔄 Refresh</button>
                    <button onclick="addUser()">➕ Add User</button>
                </div>
                <input type="text" class="search-box" placeholder="Search users..." onkeyup="searchUsers(this.value)">
                <div id="usersList" class="loading">Loading...</div>
            </div>
            
            <!-- Documents Tab -->
            <div id="documents" class="tab-content">
                <h2>Document Processing History</h2>
                <div class="actions">
                    <button onclick="refreshDocuments()">🔄 Refresh</button>
                    <button onclick="exportDocuments()">📥 Export</button>
                </div>
                <input type="text" class="search-box" placeholder="Search documents..." onkeyup="searchDocuments(this.value)">
                <div id="documentsList" class="loading">Loading...</div>
            </div>
            
            <!-- Sessions Tab -->
            <div id="sessions" class="tab-content">
                <h2>Processing Sessions</h2>
                <div class="actions">
                    <button onclick="refreshSessions()">🔄 Refresh</button>
                </div>
                <div id="sessionsList" class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5001';
        let currentTab = 'overview';
        let allUsers = [];
        let allDocuments = [];
        let allSessions = [];
        
        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
            
            // Load data for the tab
            switch(tab) {
                case 'overview':
                    loadOverview();
                    break;
                case 'users':
                    loadUsers();
                    break;
                case 'documents':
                    loadDocuments();
                    break;
                case 'sessions':
                    loadSessions();
                    break;
            }
        }
        
        // Load overview
        async function loadOverview() {
            try {
                // Simulate loading stats (replace with actual API calls)
                document.getElementById('userCount').textContent = allUsers.length || '0';
                document.getElementById('docCount').textContent = allDocuments.length || '0';
                document.getElementById('sessionCount').textContent = allSessions.length || '0';
                
                const completed = allDocuments.filter(d => d.status === 'completed').length;
                const total = allDocuments.length || 1;
                const rate = Math.round((completed / total) * 100);
                document.getElementById('successRate').textContent = rate + '%';
                
                // Recent activity
                const recentHtml = `
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${new Date().toLocaleTimeString()}</td>
                                <td>admin</td>
                                <td>Document processed</td>
                                <td><span class="status completed">Success</span></td>
                            </tr>
                        </tbody>
                    </table>
                `;
                document.getElementById('recentActivity').innerHTML = recentHtml;
            } catch (error) {
                console.error('Error loading overview:', error);
            }
        }
        
        // Load users
        async function loadUsers() {
            try {
                // Simulate user data (replace with actual API call)
                allUsers = [
                    { username: 'admin', email: 'admin@example.com', role: 'admin', createdAt: new Date() }
                ];
                
                displayUsers(allUsers);
            } catch (error) {
                document.getElementById('usersList').innerHTML = '<div class="error">Error loading users</div>';
            }
        }
        
        function displayUsers(users) {
            if (users.length === 0) {
                document.getElementById('usersList').innerHTML = '<div class="empty-state">No users found</div>';
                return;
            }
            
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>${user.username}</td>
                                <td>${user.email}</td>
                                <td><span class="role ${user.role}">${user.role}</span></td>
                                <td>${new Date(user.createdAt).toLocaleDateString()}</td>
                                <td>
                                    <button onclick="editUser('${user.username}')">Edit</button>
                                    <button onclick="deleteUser('${user.username}')">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('usersList').innerHTML = html;
        }
        
        // Load documents
        async function loadDocuments() {
            try {
                // Simulate document data (replace with actual API call)
                allDocuments = [
                    { 
                        originalName: 'sample.pdf', 
                        status: 'completed', 
                        fileType: 'pdf',
                        createdAt: new Date(),
                        size: 1024000
                    }
                ];
                
                displayDocuments(allDocuments);
            } catch (error) {
                document.getElementById('documentsList').innerHTML = '<div class="error">Error loading documents</div>';
            }
        }
        
        function displayDocuments(documents) {
            if (documents.length === 0) {
                document.getElementById('documentsList').innerHTML = '<div class="empty-state">No documents found</div>';
                return;
            }
            
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>File Name</th>
                            <th>Type</th>
                            <th>Size</th>
                            <th>Status</th>
                            <th>Processed</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${documents.map(doc => `
                            <tr>
                                <td>${doc.originalName}</td>
                                <td>${doc.fileType}</td>
                                <td>${formatFileSize(doc.size)}</td>
                                <td><span class="status ${doc.status}">${doc.status}</span></td>
                                <td>${new Date(doc.createdAt).toLocaleString()}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('documentsList').innerHTML = html;
        }
        
        // Load sessions
        async function loadSessions() {
            try {
                allSessions = [];
                document.getElementById('sessionsList').innerHTML = '<div class="empty-state">No sessions found</div>';
            } catch (error) {
                document.getElementById('sessionsList').innerHTML = '<div class="error">Error loading sessions</div>';
            }
        }
        
        // Helper functions
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function searchUsers(query) {
            const filtered = allUsers.filter(u => 
                u.username.toLowerCase().includes(query.toLowerCase()) ||
                u.email.toLowerCase().includes(query.toLowerCase())
            );
            displayUsers(filtered);
        }
        
        function searchDocuments(query) {
            const filtered = allDocuments.filter(d => 
                d.originalName.toLowerCase().includes(query.toLowerCase())
            );
            displayDocuments(filtered);
        }
        
        function refreshUsers() { loadUsers(); }
        function refreshDocuments() { loadDocuments(); }
        function refreshSessions() { loadSessions(); }
        
        function addUser() {
            alert('To add a user, use the command line:\nnode scripts/db-manager.js create-user <username> <email> <password>');
        }
        
        function editUser(username) {
            alert(`Edit functionality for ${username} - implement as needed`);
        }
        
        function deleteUser(username) {
            if (confirm(`Delete user ${username}?`)) {
                alert('To delete, use: node scripts/db-manager.js delete-user ' + username);
            }
        }
        
        function exportDocuments() {
            alert('To export data, use: node scripts/db-manager.js export');
        }
        
        // Initial load
        loadOverview();
    </script>
</body>
</html>
